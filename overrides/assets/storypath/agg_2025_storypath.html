                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 0, "label": "Abandoned horse in the forest - AGG 2025", "music": [{"composer": ["Franz Schubert"], "duration": ["4"], "id": 29, "keyword": ["natural spirit", "chase", "horse", "elf"], "label": ["Erlk\u00f6nig D328"], "lyrics": ["https://oxfordsong.org/song/erlk%C3%B6nig"], "poet": ["Johann Wolfgang von Goethe"], "score": ["https://imslp.org/wiki/Erlk%C3%B6nig%2C_D.328_(Schubert%2C_Franz)"]}], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Abandoned_horse_in_the_forest_-_AGG_2025.md\u0027\u003eAbandoned horse in the forest\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eArriving at a clearing, the feeble light of dawn reveals a noble steed. Although richly bridled, there is no trace of a rider. Perhaps the lonely rider has lost his way, or was captured by the king of elves? Carefully approaching the horse, Sasha is unnerved by the distant sound of singing female voices.\u00a0Musical pieces: Erlk\u00f6nig D328\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Abandoned horse in the forest - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 13, "label": "Meeting the Witch - AGG 2025", "music": [{"composer": ["Franz Schubert"], "duration": ["3"], "id": 53, "keyword": ["natural spirit", "night", "ruin"], "label": ["Sehnsucht D.123"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=6601"], "poet": ["Johann Wolfgang von Goethe"], "score": ["https://imslp.org/wiki/Sehnsucht,_D.123_(Schubert,_Franz)"]}], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Meeting_the_Witch_-_AGG_2025.md\u0027\u003eMeeting the Witch\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eAfter a night spent wandering, the dawn begins to break. A flock of crows suddenly darkens the early morning sky, and then disperses, leaving only a single bird behind. Sasha has the feeling that this bird is looking back at them with almost human intelligence.\u00a0Musical pieces: Sehnsucht D.123\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Meeting the Witch - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 27, "label": "Witches\u0027 ritual - AGG 2025", "music": [{"composer": ["Felix Mendelssohn"], "duration": ["3"], "id": 47, "keyword": ["ritual", "supernatural", "dance", "witch", "magic"], "label": ["Hexenlied Op. 8 n.8"], "lyrics": ["https://oxfordsong.org/song/andres-maienlied-hexenlied"], "poet": ["Ludwig Christoph Heinrich H\u00f6lty"], "score": ["https://imslp.org/wiki/12_Ges%C3%A4nge%2C_Op.8_(Mendelssohn%2C_Felix)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Witches\u0027_ritual_-_AGG_2025.md\u0027\u003eWitches\u0027 ritual\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eThe strange and mesmerising litany leads Sasha to an ancient well surrounded by trees of great age. A group of hooded figures surround the mossy stones, drawing water from the well with a frayed rope. One figure turns towards Sasha, revealing pale skin, crimson hair, and a supernatural beauty. Ymir offers them a cup of the mystical liquid.\u00a0Musical pieces: Hexenlied Op. 8 n.8\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Witches\u0027 ritual - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 1, "label": "Ancient grave - AGG 2025", "music": [{"composer": ["Robert Schumann"], "duration": ["3"], "id": 28, "keyword": ["knight", "castle", "graveyard"], "label": ["Auf einer Burg Op. 39 n. 7"], "lyrics": ["https://oxfordsong.org/song/auf-einer-burg"], "poet": ["Joseph von Eichendorff"], "score": ["https://imslp.org/wiki/Liederkreis,_Op.39_(Schumann,_Robert)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Ancient_grave_-_AGG_2025.md\u0027\u003eAncient grave\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eWandering through the graveyard, a lone sepulchre draws the attention of our character. A decayed statue depicting a knight in armour has suffered centuries of erosion; a shadow of its former glory. The epitaph on the tomb tells the tale of a nobleman of old, tragically departing from our world on the day of his marriage.Musical pieces: Auf einer Burg Op. 39 n. 7\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Ancient grave - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 2, "label": "Danse macabre - AGG 2025", "music": [{"composer": ["Hugo Wolf"], "duration": ["4"], "id": 38, "keyword": ["dance macabre", "ghost", "grave"], "label": ["Die Geister am Mummelsee IHW 22 n. 47"], "lyrics": ["https://oxfordsong.org/song/die-geister-am-mummelsee"], "poet": ["Eduard M\u00f6rike"], "score": ["https://imslp.org/wiki/M%C3%B6rike-Lieder_(Wolf%2C_Hugo)"]}], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Danse_macabre_-_AGG_2025.md\u0027\u003eDanse macabre\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eThe character witnesses a group of ghosts carrying a grave into a lake.Musical pieces: Die Geister am Mummelsee IHW 22 n. 47\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Danse macabre - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 23, "label": "Telling own story with a song - AGG 2025", "music": [{"composer": ["Robert Schumann"], "duration": ["2"], "id": 59, "keyword": ["singing", "sadness", "songbird", "animal"], "label": ["Wehmut Op. 39 no. 9"], "lyrics": ["https://oxfordsong.org/song/wehmut-2"], "poet": ["Joseph von Eichendorff"], "score": ["https://imslp.org/wiki/Liederkreis,_Op.39_(Schumann,_Robert)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Telling_own_story_with_a_song_-_AGG_2025.md\u0027\u003eTelling own story with a song\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eThe lonely figure, a Hermit by the name of Vanadis, is leading Rune to their abandoned chapel. Once arrived, the Hermit breaks their silence to offer Rune some rustic refreshment. Rune decides to repay the Hermit\u2019s hospitality by telling their tale of thwarted love and great misfortune.\u00a0Musical pieces: Wehmut Op. 39 no. 9\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Telling own story with a song - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 9, "label": "Falling unconscious from undead encounter - AGG 2025", "music": [{"composer": ["Franz Schubert"], "duration": ["6"], "id": 55, "keyword": ["death", "magic", "abandonment", "despair"], "label": ["Totengr\u00e4bers Heimweh D. 842"], "lyrics": ["https://oxfordsong.org/song/totengr%C3%A4bers-heimweh"], "poet": ["Jacob Nicolaus Craigher de Jachelutta"], "score": ["https://imslp.org/wiki/Totengr%C3%A4bers_Heimweh,_D.842_(Schubert,_Franz)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Falling_unconscious_from_undead_encounter_-_AGG_2025.md\u0027\u003eFalling unconscious from undead encounter\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eThe confrontation with the ancient spirit of the fallen knight tests Rune\u2019s nerves and faith. Visions of their own sorrows and vicissitudes resonate with the knight\u2019s tragic fate. They are joined by other spirits, who dance around them in mockery and slowly begin to drain their life-force.\u00a0Musical pieces: Totengr\u00e4bers Heimweh D. 842\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Falling unconscious from undead encounter - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 8, "label": "Falling asleep - AGG 2025", "music": [{"composer": ["Johannes Brahms"], "duration": ["4"], "id": 43, "keyword": [""], "label": ["Feldeinsamkeit Op. 86 n. 2"], "lyrics": ["https://oxfordsong.org/song/feldeinsamkeit-2"], "poet": ["Hermann Allmers"], "score": ["https://imslp.org/wiki/6_Lieder,_Op.86_(Brahms,_Johannes)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Falling_asleep_-_AGG_2025.md\u0027\u003eFalling asleep\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eThe realm of consciousness is succeeded by the dimension of dreams. Exhausted, Sasha falls into deep sleep. Lying on a carpet of fallen leaves, Sasha is at the mercy of the elements and any hostile beings who may appear.\u00a0Musical pieces: Feldeinsamkeit Op. 86 n. 2\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Falling asleep - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 3, "label": "Daydreaming about eternal love - AGG 2025", "music": [{"composer": ["Robert Schumann"], "duration": ["2"], "id": 44, "keyword": ["happiness", "joy", "Spring", "destiny"], "label": ["Fr\u00fchlingsnacht Op. 39 no. 12"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=5195"], "poet": ["Joseph von Eichendorff"], "score": ["https://imslp.org/wiki/Liederkreis,_Op.39_(Schumann,_Robert)"]}], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Daydreaming_about_eternal_love_-_AGG_2025.md\u0027\u003eDaydreaming about eternal love\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eCheerful songbirds and blooming flowers appear. The appearance of spring brings comfort and hope to our character. But are the comforts of nature and the dreams of the beloved only an illusion?Musical pieces: Fr\u00fchlingsnacht Op. 39 no. 12\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Daydreaming about eternal love - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 11, "label": "Happy ending - AGG 2025", "music": [{"composer": ["Gustav Mahler"], "duration": ["3"], "id": 30, "keyword": ["love"], "label": ["Liebst du um sch\u00f6nheit GMW 43"], "lyrics": ["https://oxfordsong.org/song/liebst-du-um-sch%C3%B6nheit"], "poet": ["Friedrich R\u00fcckert"], "score": ["https://imslp.org/wiki/R%C3%BCckert_Lieder,_GMW_39-43_(Mahler,_Gustav)"]}, {"composer": ["Franz Schubert"], "duration": ["2"], "id": 48, "keyword": ["marriage", "love"], "label": ["Hochzeitslied D. 463"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=8805"], "poet": ["Johann Georg Jacobi"], "score": ["https://imslp.org/wiki/Hochzeitslied,_D.463_(Schubert,_Franz)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Happy_ending_-_AGG_2025.md\u0027\u003eHappy ending\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eSasha and Rune are finally reunited. There are no words to describe their endless joy. A bright future awaits them, and if they haven\u2019t died, they are still living happily together. \u201cUnd wenn sie nicht gestorben sind, dann leben sie noch heute\u201d.Musical pieces: Hochzeitslied D. 463, Du bist mir lieb, Liebst du um sch\u00f6nheit GMW 43\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Happy ending - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 19, "label": "Sad ending - AGG 2025", "music": [{"composer": ["Franz Schubert"], "duration": ["4"], "id": 46, "keyword": ["abandonment", "weaving", "madness", "love", "despair"], "label": ["Gretchen am Spinnrade D.118"], "lyrics": ["https://oxfordsong.org/song/gretchen-am-spinnrade-2"], "poet": ["Johann Wolfgang von Goethe"], "score": ["https://imslp.org/wiki/Gretchen_am_Spinnrade,_D.118_(Schubert,_Franz)"]}, {"composer": ["Hugo Wolf"], "duration": ["2"], "id": 61, "keyword": ["disappointment"], "label": ["Wie viele Zeit verlor Ich IHW 15 n. 37"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=20726"], "poet": ["Paul Heyse"], "score": ["https://imslp.org/wiki/Italienisches_Liederbuch_(Wolf,_Hugo)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Sad_ending_-_AGG_2025.md\u0027\u003eSad ending\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eThe quest has failed: their love could not prevail against ill fate. Rune is destined to wed the old bachelor, imposed by their tutor, while a life of misery and regret will attend Sasha\u2026 The lovers are parted for eternity.Musical pieces: Gretchen am Spinnrade D.118, Wie viele Zeit verlor Ich IHW 15 n. 37\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Sad ending - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 4, "label": "Demonic deception - AGG 2025", "music": [{"composer": ["Johannes Brahms"], "duration": ["4"], "id": 56, "keyword": ["love", "sky", "serenade"], "label": ["Unbewegte laue Luft Op. 57 n.8"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=4257"], "poet": ["Georg Friedrich Daumer"], "score": ["https://imslp.org/wiki/8_Lieder_and_Songs%2C_Op.57_(Brahms%2C_Johannes)"]}], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Demonic_deception_-_AGG_2025.md\u0027\u003eDemonic deception\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eThe strange bird disappears from Sasha\u2019s view. Suddenly, a hooded figure appears from the point at which the bird vanished. The wanderer is revealed as Ymir, a lady with pale skin and untamed scarlet curls.\u00a0Musical pieces: Unbewegte laue Luft Op. 57 n.8\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Demonic deception - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 5, "label": "Demons keep the lovers apart - AGG 2025", "music": [{"composer": ["Franz Schubert"], "duration": ["3"], "id": 35, "keyword": ["death", "supernatural"], "label": ["Der Tod und das M\u00e4dchen D.531"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=3855\u0026RF=1"], "poet": ["Joseph von Spaun"], "score": ["https://imslp.org/wiki/Der_Tod_und_das_M%C3%A4dchen,_D.531_(Schubert,_Franz)"]}, {"composer": ["Johanna Kinkel"], "duration": ["3"], "id": 39, "keyword": ["magic", "ghost", "destiny"], "label": ["Die Geister haben\u0027s vernommen"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=105796"], "poet": ["Heinrich Heine"], "score": ["https://imslp.org/wiki/6_Lieder%2C_Op.6_(Kinkel%2C_Johanna)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Demons_keep_the_lovers_apart_-_AGG_2025.md\u0027\u003eDemons keep the lovers apart\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eThe charming figure of Ymir leads Sasha to a ruined castle in the woods. As the gates of the castle open, a beautiful, brightly-lit garden is revealed. Fair ladies and courtiers of a forgotten time entice Sasha to join them. Sasha forgets all of their worries and the memory of their beloved Rune is merely a distant echo.\u00a0Musical pieces: Die Geister haben\u0027s vernommen, Der Tod und das M\u00e4dchen D.531\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Demons keep the lovers apart - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 26, "label": "Witch\u0027s love enchantment - AGG 2025", "music": [{"composer": ["Agathe Backer Gr\u00f8ndahl"], "duration": ["3"], "id": 51, "keyword": ["oath", "night"], "label": ["In dunkler Nacht Op. 60 no. 1"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=3944"], "poet": ["Maria von Collignon"], "score": ["https://imslp.org/wiki/6_Deutsche_Liebeslieder%2C_Op.60_(Backer-Gr%C3%B8ndahl%2C_Agathe)"]}], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Witch\u0027s_love_enchantment_-_AGG_2025.md\u0027\u003eWitch\u0027s love enchantment\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eYmir, exhausted by the futility of trying to persuade Sasha to forget their lover, becomes enraged. Ymir\u2019s charming facade disintegrates, and they utter primordial and mysterious syllables - an ancient language lost to the memory of man. An ancestral enchantment is binding  Sasha\u2019s soul to the power of Ymir.\u00a0Musical pieces: In dunkler Nacht Op. 60 no. 1\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Witch\u0027s love enchantment - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 6, "label": "Despair and homesickness. Giving up their dreams - AGG 2025", "music": [{"composer": ["Clara Schumann"], "duration": ["2"], "id": 49, "keyword": ["dream"], "label": ["Ich stand in dunklen Tra\u00fcmen Op. 13 n.1"], "lyrics": ["https://oxfordsong.org/song/ihr-bildnis"], "poet": ["Heinrich Heine"], "score": ["https://imslp.org/wiki/6_Lieder,_Op.13_(Schumann,_Clara)"]}, {"composer": ["Robert Schumann"], "duration": ["2"], "id": 50, "keyword": [""], "label": ["In der Fremde Op. 39 n. 1"], "lyrics": ["https://oxfordsong.org/song/in-der-fremde-2"], "poet": ["Joseph von Eichendorff"], "score": ["https://imslp.org/wiki/Liederkreis,_Op.39_(Schumann,_Robert)"]}], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Despair_and_homesickness._Giving_up_their_dreams_-_AGG_2025.md\u0027\u003eDespair and homesickness. Giving up their dreams\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eAfter the horrifying experiences of the last hours, our character has despaired completely. Returning to the awful circumstances at home seems a better  choice than remaining here.\u00a0Musical pieces: In der Fremde Op. 39 n. 1, Ich stand in dunklen Tra\u00fcmen Op. 13 n.1\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Despair and homesickness. Giving up their dreams - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 7, "label": "Elf of the woods creates charming illusion - AGG 2025", "music": [{"composer": ["Hugo Wolf"], "duration": ["3"], "id": 32, "keyword": ["death", "dream", "flower"], "label": ["Bedeckt mich mit Blumen IHW 32 n. 36"], "lyrics": ["https://oxfordsong.org/song/bedeckt-mich-mit-blumen"], "poet": ["Emanuel Geibel"], "score": ["https://imslp.org/wiki/Spanisches_Liederbuch_(Wolf,_Hugo)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Elf_of_the_woods_creates_charming_illusion_-_AGG_2025.md\u0027\u003eElf of the woods creates charming illusion\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eWalking through the thick undergrowth, Sasha hears the sound of a small brook. While slaking their thirst, Sasha notices the ethereal sounds of an ancient song. The indistinguishable words of the song lead Sasha to a state of enchantment. While losing consciousness, a fairylike creature emerges from the water.\u00a0Musical pieces: Bedeckt mich mit Blumen IHW 32 n. 36\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Elf of the woods creates charming illusion - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 14, "label": "Mistrust of animals - AGG 2025", "music": [{"composer": ["Carl Loewe"], "duration": ["3"], "id": 33, "keyword": ["animal", "mistrust", "forest", "catalogue", "non-human"], "label": ["Der Feind Op. 145"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=14424"], "poet": ["Ernst Scherenberg"], "score": ["https://imslp.org/wiki/Liederkranz_f%C3%BCr_die_Bassstimme%2C_Op.145_(Loewe%2C_Carl)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Mistrust_of_animals_-_AGG_2025.md\u0027\u003eMistrust of animals\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eSasha suddenly wakes up, realising that exhaustion had led them to fall asleep in the middle of the forest. Dawn brings a feeling of unease to our character. Mistrusting and invisible eyes keep watch while Sasha prepares to depart.\u00a0Musical pieces: Der Feind Op. 145\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Mistrust of animals - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 10, "label": "Following path and getting lost - AGG 2025", "music": [{"composer": ["Robert Schumann"], "duration": ["3"], "id": 63, "keyword": ["hunting", "night", "forest", "horror", "wandering"], "label": ["Zwielicht Op. 39 n.10"], "lyrics": ["https://www.lieder.net/lieder/get_text.html?TextId=5280"], "poet": ["Joseph von Eichendorff"], "score": ["https://imslp.org/wiki/Liederkreis,_Op.39_(Schumann,_Robert)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Following_path_and_getting_lost_-_AGG_2025.md\u0027\u003eFollowing path and getting lost\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eSasha follows the path through the gloomy forest. Every shadow or sound is turned into an ill omen of terror by the impenetrable darkness of the night. But love drives the steps of our character forward, surmounting their ancestral fear.Musical pieces: Zwielicht Op. 39 n.10\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Following path and getting lost - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 17, "label": "Reaching higher ground during a storm - AGG 2025", "music": [], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Reaching_higher_ground_during_a_storm_-_AGG_2025.md\u0027\u003eReaching higher ground during a storm\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eRain has been falling incessantly since Sasha\u2019s departure. The path is inaccessible, and Sasha has lost their way. Their only chance is to climb the nearest hill in order to attain a new sense of orientation. Fighting against the rain and wind, Sasha realises that the storm is intensifying.\u00a0Musical pieces: St\u00fcrmisch Wandern, Op. 18 n.\u00b06\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Reaching higher ground during a storm - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 12, "label": "Lonely man is burying a coffin - AGG 2025", "music": [], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Lonely_man_is_burying_a_coffin_-_AGG_2025.md\u0027\u003eLonely man is burying a coffin\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eAmidst the ruins, Rune is woken by the faint light of dawn. From one of the surviving gothic windows, Rune sees a lonely figure digging a deep hole in the nearby graveyard. Rune decides to ask the only living being in the castle for directions.\u00a0Musical pieces: Die alten, b\u00f6sen Lieder Op. 48 no. 16\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Lonely man is burying a coffin - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 18, "label": "Recognition of the evil sorceress - AGG 2025", "music": [], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Recognition_of_the_evil_sorceress_-_AGG_2025.md\u0027\u003eRecognition of the evil sorceress\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eAfter being hit by the pebble, the strange bird emits a sharp sound like a woman\u2019s scream. Is it possible? Instead of a bird, Sasha is confronted by a furious witch with pale skin and scarlet curls. Shrieking curses in an unknown language, the figure approaches. Sasha runs away as fast as possible.Musical pieces: Waldesgespr\u00e4ch, op. 39 no. 3\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Recognition of the evil sorceress - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 15, "label": "Moonlight -  AGG 2025", "music": [{"composer": ["Robert Schumann"], "duration": ["4"], "id": 52, "keyword": ["moonlight", "moon"], "label": ["Mondnacht Op. 39 no. 5"], "lyrics": ["https://oxfordsong.org/song/mondnacht-2"], "poet": ["Joseph von Eichendorff"], "score": ["https://imslp.org/wiki/Liederkreis,_Op.39_(Schumann,_Robert)"]}], "public_choice": true, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Moonlight_-__AGG_2025.md\u0027\u003eMoonlight\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eAs the clouds disperse, our character finds shelter in a shepherd\u2019s hut. Through the missing roof, it is possible to gaze at the beautiful waxing moon, while the sun slowly rises in the east. In the distance, our character sees the crossroads where they had planned to meet their beloved.\u00a0Musical pieces: Mondnacht Op. 39 no. 5\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Moonlight -  AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 16, "label": "Prayer of the Hermit - AGG 2025", "music": [{"composer": ["Robert Schumann"], "duration": ["2"], "id": 45, "keyword": ["prayer"], "label": ["Gedichte der K\u00f6nigin Maria Stuart Op.135 n.5"], "lyrics": ["https://oxfordsong.org/song/gebet-2"], "poet": ["Gisbert Freiherr von Vincke"], "score": ["https://imslp.org/wiki/Gedichte_der_K%C3%B6nigin_Maria_Stuart,_Op.135_(Schumann,_Robert)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Prayer_of_the_Hermit_-_AGG_2025.md\u0027\u003ePrayer of the Hermit\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eAfter having listened to Rune\u2019s story, the hermit recites a prayer in a low and solemn tone. The words of the invocation reveal a glimpse of Vanadis\u2019s past, echoing the same miseries of our character\u2019s love story. Rune regains strength and faith. After some kind words of farewell, they resume their journey.Musical pieces: Gedichte der K\u00f6nigin Maria Stuart Op.135 n.5\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Prayer of the Hermit - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 21, "label": "Staying awake - AGG 2025", "music": [{"composer": ["Johannes Brahms"], "duration": ["4"], "id": 41, "keyword": ["moon", "forest", "night"], "label": ["Die Mainacht Op. 43 n.2"], "lyrics": ["https://oxfordsong.org/song/die-mainacht-2"], "poet": ["Ludwig Christoph Heinrich H\u00f6lty"], "score": ["https://imslp.org/wiki/4_Songs%2C_Op.43_(Brahms%2C_Johannes)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Staying_awake_-_AGG_2025.md\u0027\u003eStaying awake\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eDespite muddy boots and wet clothes, Sasha continues to strive against the stormy weather. Maintaining a steady pace, the trail gradually becomes clearer. In the distance, the old estate is visible. Sasha\u2019s thoughts of their beloved are a guiding star leading them tirelessly onwards.\u00a0Musical pieces: Die Mainacht Op. 43 n.2\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Staying awake - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 20, "label": "Seek shelter in abandoned monastery - AGG 2025", "music": [{"composer": ["Franz Schubert"], "duration": ["4"], "id": 40, "keyword": ["Christian nun", "escapism"], "label": ["Die junge Nonne D.828"], "lyrics": ["https://oxfordsong.org/song/die-junge-nonne"], "poet": ["Jacob Nicolaus Craigher de Jachelutta"], "score": ["https://imslp.org/wiki/Die_junge_Nonne,_D.828_(Schubert,_Franz)"]}], "public_choice": false, "shape": "dot", "size": 10, "title": "\n            \u003cbody\u003e\n            \u003ch3\u003e \u003ca href=\u0027https://nicholascorniaorpheus.github.io/a_gothic_gamebook//scenes/Seek_shelter_in_abandoned_monastery_-_AGG_2025.md\u0027\u003eSeek shelter in abandoned monastery\u003c/a\u003e\u003c/h3\u003e\n            \u003cp\u003eRune manages to find refuge in an old monastery, by opening the rusty old gate of the building. Empty halls tell forgotten tales of countless generations of nuns and their seclusion. Rune falls asleep in an austere cell.Musical pieces: Die junge Nonne D.828\u003c/p\u003e\u003cimg src=\"https://nicholascorniaorpheus.github.io/a_gothic_gamebook/scene/Seek shelter in abandoned monastery - AGG 2025.webp\" width=\"250\" height=\"200\"\u003e\n            \u003c/body\u003e\n            ", "value": 100}, {"color": "#a55faa", "font": {"color": "#f8f7f4"}, "id": 22, "label": "Taking a \"shortcut\"
